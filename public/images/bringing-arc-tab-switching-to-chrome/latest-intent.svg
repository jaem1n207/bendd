<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="title desc">
<title id="title">논리적 선택과 실제 활성화의 분리</title><desc id="desc">입력은 모두 논리적 상태에 반영하고 실제 활성화는 한 번에 하나, 대기는 최신 목적지 하나만 유지한다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="hsl(210, 8%, 40%)"/></marker></defs>
<rect width="960" height="600" rx="24" fill="hsl(60, 13%, 97%)"/>
<g font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif"><text x="40" y="47" font-size="17" font-weight="600" fill="hsl(210, 8%, 40%)" text-anchor="start">03 / STATE</text><text x="40" y="91" font-size="32" font-weight="650" fill="hsl(210, 14%, 17%)" text-anchor="start">빠른 입력을 오래된 요청으로 쌓지 않기</text><text x="40" y="126" font-size="21" font-weight="400" fill="hsl(210, 8%, 40%)" text-anchor="start">시작은 A 탭. B 전환 응답이 오기 전에 입력이 더 들어와요.</text><text x="40" y="184" font-size="23" font-weight="600" fill="hsl(210, 14%, 17%)" text-anchor="start">Control을 놓으며 확정한 목적지</text><rect x="40" y="205" width="200" height="94" rx="16" fill="hsl(60, 20%, 99%)" stroke="hsl(70, 12%, 79%)" /><text x="62" y="235" font-size="17" font-weight="500" fill="hsl(210, 8%, 40%)" text-anchor="start">1</text><text x="140" y="269" font-size="35" font-weight="650" fill="hsl(210, 14%, 17%)" text-anchor="middle">B</text><path d="M244 252L259 252" stroke="hsl(210, 8%, 40%)" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="264" y="205" width="200" height="94" rx="16" fill="hsl(60, 20%, 99%)" stroke="hsl(70, 12%, 79%)" /><text x="286" y="235" font-size="17" font-weight="500" fill="hsl(210, 8%, 40%)" text-anchor="start">2</text><text x="364" y="269" font-size="35" font-weight="650" fill="hsl(210, 14%, 17%)" text-anchor="middle">A</text><path d="M468 252L483 252" stroke="hsl(210, 8%, 40%)" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="488" y="205" width="200" height="94" rx="16" fill="hsl(60, 20%, 99%)" stroke="hsl(70, 12%, 79%)" /><text x="510" y="235" font-size="17" font-weight="500" fill="hsl(210, 8%, 40%)" text-anchor="start">3</text><text x="588" y="269" font-size="35" font-weight="650" fill="hsl(210, 14%, 17%)" text-anchor="middle">B</text><path d="M692 252L707 252" stroke="hsl(210, 8%, 40%)" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="712" y="205" width="200" height="94" rx="16" fill="hsl(84, 36%, 84%)" stroke="hsl(70, 12%, 79%)" /><text x="734" y="235" font-size="17" font-weight="500" fill="hsl(210, 8%, 40%)" text-anchor="start">4</text><text x="812" y="269" font-size="35" font-weight="650" fill="hsl(210, 14%, 17%)" text-anchor="middle">A</text><text x="40" y="335" font-size="23" font-weight="600" fill="hsl(210, 14%, 17%)" text-anchor="start">논리적 MRU는 입력마다 갱신 → 다음 입력의 기준</text><rect x="40" y="367" width="410" height="94" rx="16" fill="hsl(80, 24%, 94%)" stroke="hsl(70, 12%, 79%)" /><text x="64" y="404" font-size="21" font-weight="500" fill="hsl(210, 8%, 40%)" text-anchor="start">진행 중인 요청</text><text x="64" y="439" font-size="27" font-weight="600" fill="hsl(210, 14%, 17%)" text-anchor="start">B 활성화 · 응답 대기</text><rect x="477" y="367" width="435" height="94" rx="16" fill="hsl(84, 36%, 84%)" stroke="hsl(70, 12%, 79%)" /><text x="501" y="404" font-size="21" font-weight="500" fill="hsl(210, 8%, 40%)" text-anchor="start">대기 목적지는 하나</text><text x="501" y="439" font-size="25" font-weight="600" fill="hsl(210, 14%, 17%)" text-anchor="start">A → B → 마지막 A로 교체</text><path d="M245 461L245 506" stroke="hsl(210, 8%, 40%)" stroke-width="2" fill="none"/><path d="M245 506L482 506" stroke="hsl(210, 8%, 40%)" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="495" y="481" width="417" height="71" rx="16" fill="hsl(60, 20%, 99%)" stroke="hsl(70, 12%, 79%)" /><text x="516" y="524" font-size="24" font-weight="600" fill="hsl(210, 14%, 17%)" text-anchor="start">B 응답 뒤 마지막 A 요청</text><text x="40" y="582" font-size="20" font-weight="400" fill="hsl(210, 8%, 40%)" text-anchor="start">응답은 연결 세대·요청 순번을 대조해 현재 요청에만 반영해요.</text></g></svg>