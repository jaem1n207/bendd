<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="title desc">
<title id="title">캡처 이미지의 상태 검증</title><desc id="desc">캡처와 이미지 축소 사이 탭이나 탐색 상태가 바뀌면 늦은 이미지를 버린다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="hsl(210, 8%, 40%)"/></marker></defs>
<rect width="960" height="560" rx="24" fill="hsl(60, 13%, 97%)"/>
<g font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif"><text x="40" y="47" font-size="17" font-weight="600" fill="hsl(210, 8%, 40%)" text-anchor="start">04 / PREVIEW</text><text x="40" y="91" font-size="32" font-weight="650" fill="hsl(210, 14%, 17%)" text-anchor="start">늦게 온 이미지는 누구의 화면일까요?</text><text x="40" y="126" font-size="21" font-weight="400" fill="hsl(210, 8%, 40%)" text-anchor="start">캡처 도착 시점만 보지 않고, 시작한 상태와 대조해요.</text><rect x="40" y="160" width="880" height="84" rx="16" fill="hsl(80, 24%, 94%)" stroke="hsl(70, 12%, 79%)" /><text x="64" y="195" font-size="20" font-weight="500" fill="hsl(210, 8%, 40%)" text-anchor="start">캡처 시작</text><text x="64" y="228" font-size="26" font-weight="650" fill="hsl(210, 14%, 17%)" text-anchor="start">A 탭 · 탐색 세대 7</text><path d="M480 244L480 279" stroke="hsl(210, 8%, 40%)" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="40" y="291" width="880" height="83" rx="16" fill="hsl(60, 20%, 99%)" stroke="hsl(70, 12%, 79%)" /><text x="64" y="325" font-size="20" font-weight="500" fill="hsl(210, 8%, 40%)" text-anchor="start">캡처 또는 축소 중</text><text x="64" y="359" font-size="26" font-weight="600" fill="hsl(210, 14%, 17%)" text-anchor="start">B로 전환하거나 A가 새 페이지로 이동</text><path d="M480 374L480 408" stroke="hsl(210, 8%, 40%)" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="40" y="421" width="880" height="85" rx="16" fill="hsl(84, 36%, 84%)" stroke="hsl(70, 12%, 79%)" /><text x="64" y="456" font-size="20" font-weight="500" fill="hsl(210, 8%, 40%)" text-anchor="start">결과를 쓰기 전 다시 확인</text><text x="64" y="490" font-size="24" font-weight="600" fill="hsl(210, 14%, 17%)" text-anchor="start">상태가 달라졌으면 폐기 · 없는 이미지는 제목과 아이콘으로</text><text x="40" y="542" font-size="20" font-weight="400" fill="hsl(210, 8%, 40%)" text-anchor="start">이미지 키: 연결 + 세대 + 창 + 탭 + 탐색 세대</text></g></svg>