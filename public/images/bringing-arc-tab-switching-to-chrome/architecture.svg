<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" role="img" aria-labelledby="title desc">
<title id="title">macOS 앱과 Chrome 확장의 역할</title><desc id="desc">물리 입력과 네이티브 전환창은 앱, 탭 상태와 활성화는 확장이 소유하고 Native Host가 둘을 중계한다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="hsl(210, 8%, 40%)"/></marker></defs>
<rect width="960" height="720" rx="24" fill="hsl(60, 13%, 97%)"/>
<g font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif"><text x="40" y="47" font-size="17" font-weight="600" fill="hsl(210, 8%, 40%)" text-anchor="start">02 / ARCHITECTURE</text><text x="40" y="91" font-size="32" font-weight="650" fill="hsl(210, 14%, 17%)" text-anchor="start">입력은 macOS가, 탭은 Chrome이</text><text x="40" y="126" font-size="21" font-weight="400" fill="hsl(210, 8%, 40%)" text-anchor="start">웹페이지 실행 상태에 기대지 않고 역할을 나눴어요.</text><rect x="40" y="159" width="880" height="66" rx="16" fill="hsl(80, 24%, 94%)" stroke="hsl(70, 12%, 79%)" /><text x="65" y="201" font-size="25" font-weight="600" fill="hsl(210, 14%, 17%)" text-anchor="start">Ctrl + Tab · Control 해제 · Esc</text><path d="M480 225L480 253" stroke="hsl(210, 8%, 40%)" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="40" y="262" width="880" height="106" rx="16" fill="hsl(84, 36%, 84%)" stroke="hsl(70, 12%, 79%)" /><text x="65" y="302" font-size="27" font-weight="650" fill="hsl(210, 14%, 17%)" text-anchor="start">macOS 앱 · Swift / AppKit</text><text x="65" y="340" font-size="21" font-weight="400" fill="hsl(210, 14%, 17%)" text-anchor="start">CGEventTap  →  MRU 상태  →  포커스를 가져오지 않는 NSPanel</text><path d="M480 368L480 417" stroke="hsl(210, 8%, 40%)" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="504" y="399" font-size="20" font-weight="400" fill="hsl(210, 8%, 40%)" text-anchor="start">사용자 전용 Unix socket</text><rect x="40" y="429" width="880" height="72" rx="16" fill="hsl(60, 20%, 99%)" stroke="hsl(70, 12%, 79%)" /><text x="65" y="473" font-size="25" font-weight="600" fill="hsl(210, 14%, 17%)" text-anchor="start">Native Host · 프로필별 연결을 중계</text><path d="M480 501L480 550" stroke="hsl(210, 8%, 40%)" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="504" y="533" font-size="20" font-weight="400" fill="hsl(210, 8%, 40%)" text-anchor="start">Native Messaging · connectNative()</text><rect x="40" y="563" width="880" height="105" rx="16" fill="hsl(80, 24%, 94%)" stroke="hsl(70, 12%, 79%)" /><text x="65" y="605" font-size="26" font-weight="650" fill="hsl(210, 14%, 17%)" text-anchor="start">Chrome 확장 · TypeScript / Manifest V3</text><text x="65" y="643" font-size="23" font-weight="400" fill="hsl(210, 14%, 17%)" text-anchor="start">탭 이벤트·미리보기  ←→  활성화 요청·tabs.update</text><text x="40" y="702" font-size="19" font-weight="400" fill="hsl(210, 8%, 40%)" text-anchor="start">연결은 프로필마다 · 입력 감시와 전환창은 하나의 앱에</text></g></svg>